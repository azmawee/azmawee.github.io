<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halaman tidak dijumpai · Tengku Azmawee</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#14130f">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%2314130f'/%3E%3Ctext%20x='32'%20y='45'%20font-family='Georgia,serif'%20font-size='38'%20fill='%23d9a94f'%20text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#14130f;--text:#f0e9da;--muted:#a99f8d;--line:rgba(240,233,218,.14);
  --gold:#d9a94f;
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;
  --mono:ui-monospace,'Cascadia Mono',Consolas,'Liberation Mono',monospace;
  color-scheme:dark;
}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;
  background:var(--bg);color:var(--text);
  font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  line-height:1.65;padding:2rem;caret-color:var(--gold);
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.05;
  background-image:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='140'%20height='140'%3E%3Cfilter%20id='n'%3E%3CfeTurbulence%20type='fractalNoise'%20baseFrequency='0.85'%20numOctaves='2'%20stitchTiles='stitch'/%3E%3C/filter%3E%3Crect%20width='140'%20height='140'%20filter='url(%23n)'/%3E%3C/svg%3E");
}
main{max-width:52ch;position:relative}
p{margin:0}
h1{
  font-family:var(--serif);font-weight:600;letter-spacing:-.02em;
  font-size:clamp(2rem,7vw,3.2rem);line-height:1.08;margin:0 0 1rem;text-wrap:balance;
}
.lead{color:var(--muted);max-width:46ch;margin:0 0 1.8rem}
.lead span{color:var(--text)}
a.ret{
  display:inline-flex;align-items:center;gap:.5rem;
  color:var(--text);text-decoration:none;
  border:1px solid var(--line);border-radius:7px;
  padding:.6rem 1rem;min-height:42px;font-size:.9rem;
  transition:color .25s cubic-bezier(.16,1,.3,1),border-color .25s cubic-bezier(.16,1,.3,1);
}
a.ret:hover{color:var(--gold);border-color:var(--gold)}
a.ret svg{width:16px;height:16px}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
::selection{background:var(--gold);color:var(--bg)}
</style>
</head>
<body>
<main>
  <h1>404, halaman tidak dijumpai. Page not found.</h1>
  <p class="lead">Pautan ini mungkin sudah berpindah atau tidak pernah wujud. <span>Semua pautan sebenar ada di laman utama.</span></p>
  <a class="ret" href="/">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M19 12H6m0 0 6-6m-6 6 6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Balik ke laman utama
  </a>
</main>
</body>
</html>
